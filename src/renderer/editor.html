<div class="editor-area">
  <div id="editor-tabs-bar" class="editor-tabs"></div>

  <div class="editor-main-container" style="flex: 1; position: relative; display: flex; flex-direction: column;">
    <div id="no-file-notice" class="no-file-notice">
      <p>프로젝트 폴더를 열거나 좌측 상단 <b>File ➔ 새 프로젝트</b>를 선택하세요.</p>
    </div>
    <div id="monaco-editor-container" style="display: none; width: 100%; height: 100%;"></div>

    <div id="image-viewer"
      style="display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; background: #181818; padding: 20px; overflow: auto;">
      <img id="viewer-img" src=""
        style="display: none; max-width: 90%; max-height: 85%; border: 1px solid #333333; box-shadow: 0 8px 24px rgba(0,0,0,0.6); object-fit: contain;" />
      <video id="viewer-video" controls autoplay loop muted
        style="display: none; max-width: 90%; max-height: 85%; border: 1px solid #333333; box-shadow: 0 8px 24px rgba(0,0,0,0.6); outline: none;"></video>
      <div id="image-info" style="margin-top: 12px; font-size: 12px; color: #888888;"></div>
    </div>
  </div>

  <div id="slot-panels" style="display:contents"></div>
</div>
