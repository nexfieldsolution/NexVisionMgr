<div id="control-panel"
  style="width: 360px; background: #252526; border-left: 1px solid #1e1e1e; display: flex; flex-direction: column; flex-shrink: 0; height: 100%; position: relative;">
  <div class="resize-handle-ew" onmousedown="startVisionPanelResize(event)"></div>
  <div style="height: 35px; background: #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #1e1e1e;">
    <span style="font-size: 12px; font-weight: bold; color: #cccccc; display: flex; align-items: center; gap: 6px;">🎛️ 제어 패널 (Control Panel)</span>
    <span onclick="toggleVisionPanel(false)" title="패널 닫기" style="cursor: pointer; color: #888; font-size: 12px;"
      onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'">✕</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: #252526; overflow: auto;">
    <div id="vision-no-result" style="color: #666; font-size: 12px; text-align: center;">
      파이썬 비전 스크립트를 실행(▶)하면<br>실행 결과 이미지/영상이 여기에 자동 출력됩니다.
    </div>
    <img id="vision-result-img" src=""
      style="display: none; max-width: 100%; max-height: 100%; border: 1px solid #3c3c3c; box-shadow: 0 6px 18px rgba(0,0,0,0.5); object-fit: contain;" />
    <video id="vision-result-video" controls autoplay loop muted
      style="display: none; max-width: 100%; max-height: 100%; border: 1px solid #3c3c3c; box-shadow: 0 6px 18px rgba(0,0,0,0.5); outline: none;"></video>
  </div>
  <div id="vision-status-bar"
    style="padding: 8px 12px; font-size: 11px; color: #007acc; background: #252526; border-top: 1px solid #1e1e1e; font-weight: bold;">
    상태: 대기 중
  </div>
</div>
